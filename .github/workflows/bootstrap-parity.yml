name: Bootstrap Native Parity

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/bootstrap-trigger.txt'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore native parity source bundle
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/Z28NYzah3Ed/Z28NYwah3Ed/' .bootstrap/bundle.part05
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          exp=['5258909b8acd74fa69d4127f83f9ee9973898e801f4e59c18061662ce7efbc4e','52b89ea45f2a42dafa7907a435c72062d567203d6226a08fea4efa11dcccd1dc','354464297a875c0ccf789b8aad83d906f5605c5a0a96e419becd76f4d06d1b56','38976b938ea29c9a6051b51e95733cc0d7e0406cdc645b42e936fd5d6e274e06','b3483e9741cf3bd46958f0b44660299f980a9440dcdec5065ba9e078a0ede5ea','91cd8d1d685b1111d6ea3e3d5e613d4ee1285580f37657319b379fdc7891ab52','d30ecd21a901f7a081bacfe9d13400aacf3fc6be8c19c58031ceb48c4263a8fb','b72dd584d6a076e5b66934163e59175a581461342f6a5709e6a4b73aade9e613','44eb5480eb52d484aad60c416e85b31b9d1fcd069574eb462d765acc29e13697','1a177090796784e2fde7f42f7f8f108d8452a5c239d98f9ee91166904afa7fb5']
          s=Path('.bootstrap/bundle.part06').read_bytes()
          print('part06_length',len(s))
          for i,e in enumerate(exp):
              b=s[i*1000:(i+1)*1000]
              h=hashlib.sha256(b).hexdigest()
              if h!=e:
                  print('part06_first_bad_block',i,'sha',h)
                  print('part06_bad_block_repr',repr(b))
                  break
          PY
          cat .bootstrap/bundle.part* > /tmp/native-parity.b64
          base64 --decode --ignore-garbage /tmp/native-parity.b64 > /tmp/native-parity.tar.gz
          tar -xzf /tmp/native-parity.tar.gz -C .
          mkdir -p resources
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Port Reference OS feature parity to native C++23"
          git push origin HEAD:main
