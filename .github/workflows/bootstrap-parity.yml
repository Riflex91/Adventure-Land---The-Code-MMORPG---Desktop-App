name: Patch Native Parity

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/bootstrap-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix runtime helper declaration order
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/app.cpp')
          text = p.read_text(encoding='utf-8')

          marker = 'std::string flatten_scalar(const json&v){if(v.is_string())return v.get<std::string>();if(v.is_boolean())return v.get<bool>()?"true":"false";if(v.is_number())return v.dump();return v.dump();}\n}'
          replacement = marker[:-1] + '\ndouble jnum(const json& o,const char* key,double def=0.0);\njson runtime_layer(Database& db,const json& runtime);\n}'
          if 'double jnum(const json& o,const char* key,double def=0.0);' not in text:
              if marker not in text:
                  raise SystemExit('top helper marker not found')
              text = text.replace(marker, replacement, 1)

          definition = 'double jnum(const json& o,const char* key,double def=0.0){'
          fixed = 'double jnum(const json& o,const char* key,double def){'
          if definition in text:
              text = text.replace(definition, fixed, 1)
          elif fixed not in text:
              raise SystemExit('jnum definition marker not found')

          p.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.cpp
          if git diff --cached --quiet; then
            echo "No patch changes."
            exit 0
          fi
          git commit -m "Fix native runtime helper declaration order"
          git push origin HEAD:main
