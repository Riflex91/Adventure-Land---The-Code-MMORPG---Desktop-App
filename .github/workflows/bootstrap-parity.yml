name: Bootstrap Native Parity

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/bootstrap-trigger.txt'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore native parity source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/bundle.part* > /tmp/native-parity.b64
          base64 -d /tmp/native-parity.b64 > /tmp/native-parity.tar.gz
          tar -xzf /tmp/native-parity.tar.gz -C .
          mkdir -p resources
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Port Reference OS feature parity to native C++23"
          git push origin HEAD:main
