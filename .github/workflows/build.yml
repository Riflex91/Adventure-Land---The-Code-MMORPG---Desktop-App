name: Build Desktop App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x64:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ python3 nodejs \
            libsqlite3-dev nlohmann-json3-dev libglfw3-dev libgl1-mesa-dev libcurl4-openssl-dev

      - name: Fetch full official Adventure Land dataset
        run: node tools/fetch_official.mjs resources/official_snapshot.json

      - name: Generate indexed SQLite database
        run: python3 tools/build_db.py resources/official_snapshot.json resources/reference.db

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAL_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Core regression test
        run: ./build/al-core-test resources/reference.db

      - name: Package
        run: |
          mkdir -p package/AdventureLandReferenceOS/resources
          cp build/adventure-land-reference-os package/AdventureLandReferenceOS/
          cp resources/reference.db package/AdventureLandReferenceOS/resources/
          cp README.md package/AdventureLandReferenceOS/
          chmod +x package/AdventureLandReferenceOS/adventure-land-reference-os
          tar -C package -czf AdventureLandReferenceOS-Linux-x86_64.tar.gz AdventureLandReferenceOS

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdventureLandReferenceOS-Linux-x86_64
          path: AdventureLandReferenceOS-Linux-x86_64.tar.gz
          if-no-files-found: error
          compression-level: 0

  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch full official Adventure Land dataset
        shell: pwsh
        run: node tools/fetch_official.mjs resources/official_snapshot.json

      - name: Generate indexed SQLite database
        shell: pwsh
        run: python tools/build_db.py resources/official_snapshot.json resources/reference.db

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git clone --depth 1 https://github.com/microsoft/vcpkg.git $root
          & (Join-Path $root 'bootstrap-vcpkg.bat') -disableMetrics
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install static native dependencies
        shell: pwsh
        run: '& "$env:VCPKG_ROOT\vcpkg.exe" install sqlite3[fts5]:x64-windows-static glfw3:x64-windows-static nlohmann-json:x64-windows-static'

      - name: Configure
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VCPKG_ROOT 'scripts/buildsystems/vcpkg.cmake'
          cmake -S . -B build -A x64 -DCMAKE_TOOLCHAIN_FILE="$toolchain" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DAL_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Core regression test
        shell: pwsh
        run: .\build\Release\al-core-test.exe .\resources\reference.db

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package\AdventureLandReferenceOS\resources | Out-Null
          Copy-Item build\Release\adventure-land-reference-os.exe package\AdventureLandReferenceOS\AdventureLandReferenceOS.exe
          Copy-Item resources\reference.db package\AdventureLandReferenceOS\resources\reference.db
          Copy-Item README.md package\AdventureLandReferenceOS\README.md
          Compress-Archive -Path package\AdventureLandReferenceOS -DestinationPath AdventureLandReferenceOS-Windows-x64.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdventureLandReferenceOS-Windows-x64
          path: AdventureLandReferenceOS-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0
